global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: security
    static_configs:
      - targets:
          - security:3000

  - job_name: uploader
    static_configs:
      - targets:
          - uploader:3000

  - job_name: minio
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets:
          - storage:9000